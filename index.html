  <body>
    <div id="root"></div>
    <script>
      // Restore path after GitHub Pages redirect from 404.html
      (function() {
        console.log('index.html: Checking for redirectPath...');
        var redirectPath = sessionStorage.getItem('redirectPath');
        console.log('index.html: Found redirectPath:', redirectPath);
        if (redirectPath) {
          sessionStorage.removeItem('redirectPath');
          // Strip the base path if present since React Router will add it back
          var cleanPath = redirectPath.replace('/CartSyncDemo', '');
          if (!cleanPath) cleanPath = '/';
          console.log('index.html: Restoring clean path:', cleanPath);
          history.replaceState(null, null, '/CartSyncDemo' + cleanPath);
        }
      })();
    </script>
