<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CartSync - Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect solution
      // Store the current path and redirect to index.html
      var path = window.location.pathname + window.location.search + window.location.hash;
      console.log('404.html: Storing path:', path);
      sessionStorage.setItem('redirectPath', path);
      console.log('404.html: SessionStorage set, redirecting...');
      window.location.replace(window.location.origin + '/CartSyncDemo/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
